spring.application.name=city-events

# db connection
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/cityevents}
spring.datasource.username=${DB_USERNAME:admin_cityevents}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

# flyway conf
spring.flyway.enabled=true