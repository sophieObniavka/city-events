services:
  postgres:
    image: postgres:18
    container_name: city-events-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cityevents}
      POSTGRES_USER: ${POSTGRES_USER:-admin_cityevents}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin_cityevents} -d ${POSTGRES_DB:-cityevents}" ]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  postgres_data:
